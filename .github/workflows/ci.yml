name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Code Quality, Invariants & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (Client & Cloudflare Worker)
        run: npm run typecheck

      - name: Lint Source Code
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm run test:run

      - name: Validate Production Assets
        run: npm run validate:assets

      - name: Validate Game Content & Localization Parity
        run: npm run validate:content

      - name: Run Campaign Balance Simulation Smoke
        run: npm run simulate:campaign -- --runs 200

      - name: Run Director Fuzz & Invariant Suite Smoke
        run: npm run fuzz:director -- --runs 5000

      - name: Apply Local D1 Database Migrations
        run: npm run db:local

      - name: Build Production Client Bundle
        run: npm run build
