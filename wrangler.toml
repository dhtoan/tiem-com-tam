name = "tiem-com-tam"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tiem-com-tam-db"
database_id = "local-d1-id"
migrations_dir = "migrations"
